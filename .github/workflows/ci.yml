name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/midas_test?schema=public"
      JWT_SECRET: "ci-secret-key-1234567890-test"
      NODE_ENV: "test"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend run prisma:generate

      - name: Check code formatting and linting
        run: pnpm run pre-commit

      - name: Run unit test suites (Frontend & Backend)
        run: pnpm test

      - name: Build frontend production bundle
        run: pnpm --filter frontend run build
